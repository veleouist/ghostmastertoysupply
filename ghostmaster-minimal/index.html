<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostmaster Toy Supply Co. | Under Construction</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f2eee5;
      color: #161413;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      padding: 32px 18px;
      text-align: center;
    }
    img {
      display: block;
      width: min(92vw, 1000px);
      max-height: 66svh;
      height: auto;
      object-fit: contain;
      margin: 0 auto 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(19px, 3vw, 34px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img src="ghostmaster-logo.png" alt="Ghostmaster Toy Supply Co." width="2048" height="1120">
    <h1>Site Under Construction</h1>
  </main>
</body>
</html>
